<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>India Market Intelligence Dashboards</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23891f1a'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%23fff1e5' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1b18;
      --muted: #6d6860;
      --line: #d8d0c4;
      --panel: #fffaf2;
      --paper: #fff1e5;
      --accent: #b3312a;
      --accent-strong: #891f1a;
      --shadow: 0 10px 28px rgba(38, 31, 23, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 16px;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 241, 229, 0.96);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.65) inset;
      backdrop-filter: blur(10px);
    }

    .brand {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 700;
    }

    .brand-kicker {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .switcher {
      display: inline-grid;
      grid-template-columns: repeat(2, minmax(128px, 1fr));
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }

    .tab {
      appearance: none;
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tab:hover,
    .tab:focus-visible {
      color: var(--ink);
      outline: 2px solid rgba(179, 49, 42, 0.25);
      outline-offset: 1px;
    }

    .tab[aria-selected="true"] {
      background: var(--accent);
      color: #fffaf2;
      box-shadow: 0 1px 3px rgba(38, 31, 23, 0.18);
    }

    .open-link {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      background: var(--panel);
      color: var(--accent-strong);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .open-link:hover,
    .open-link:focus-visible {
      border-color: var(--accent);
      outline: 2px solid rgba(179, 49, 42, 0.22);
      outline-offset: 1px;
    }

    .frame-wrap {
      min-height: 0;
      padding: 12px;
    }

    .dashboard-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 87px);
      min-height: 640px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 10px;
      }

      .brand-title {
        font-size: 20px;
      }

      .switcher {
        width: 100%;
      }

      .open-link {
        width: 100%;
      }

      .frame-wrap {
        padding: 8px;
      }

      .dashboard-frame {
        height: calc(100vh - 174px);
        min-height: 560px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-title">India Market Intelligence</h1>
        <div class="brand-kicker" id="dashboardDescription">VAHAN vehicle registration dashboard</div>
      </div>

      <div class="switcher" role="tablist" aria-label="Dashboard switcher">
        <button class="tab" id="tab-vahan" type="button" role="tab" aria-selected="true" aria-controls="dashboardFrame" data-dashboard="vahan">VAHAN Auto</button>
        <button class="tab" id="tab-solar" type="button" role="tab" aria-selected="false" aria-controls="dashboardFrame" data-dashboard="solar">Solar DCR</button>
      </div>

      <a class="open-link" id="openDirect" href="vahan_dashboard_project/vahan_dashboard_v19.html" target="_blank" rel="noopener">Open full page</a>
    </header>

    <section class="frame-wrap" aria-label="Selected dashboard">
      <iframe
        class="dashboard-frame"
        id="dashboardFrame"
        title="VAHAN vehicle registration dashboard"
      ></iframe>
    </section>
  </main>

  <script>
    const dashboards = {
      vahan: {
        label: "VAHAN Auto",
        description: "VAHAN vehicle registration dashboard",
        title: "VAHAN vehicle registration dashboard",
        src: "vahan_dashboard_project/vahan_dashboard_v19.html"
      },
      solar: {
        label: "Solar DCR",
        description: "Solar DCR manufacturing intelligence dashboard",
        title: "Solar DCR manufacturing intelligence dashboard",
        src: "solar_dcr_scrape/solar_dcr_dashboard.html"
      }
    };

    const frame = document.getElementById("dashboardFrame");
    const openDirect = document.getElementById("openDirect");
    const description = document.getElementById("dashboardDescription");
    const tabs = Array.from(document.querySelectorAll("[data-dashboard]"));
    const dashboardVersions = {};
    let activeDashboard = "vahan";

    function normalizeDashboard(value) {
      return Object.prototype.hasOwnProperty.call(dashboards, value) ? value : "vahan";
    }

    function setDashboard(next, shouldPushHash = true) {
      const key = normalizeDashboard(next);
      const item = dashboards[key];
      activeDashboard = key;

      const version = dashboardVersions[key];
      frame.src = version ? `${item.src}?v=${encodeURIComponent(version)}` : item.src;
      frame.title = item.title;
      openDirect.href = version ? `${item.src}?v=${encodeURIComponent(version)}` : item.src;
      description.textContent = item.description;

      for (const tab of tabs) {
        const selected = tab.dataset.dashboard === key;
        tab.setAttribute("aria-selected", selected ? "true" : "false");
      }

      document.title = `${item.label} | India Market Intelligence`;

      if (shouldPushHash && window.location.hash !== `#${key}`) {
        window.history.replaceState(null, "", `#${key}`);
      }
    }

    for (const tab of tabs) {
      tab.addEventListener("click", () => setDashboard(tab.dataset.dashboard));
    }

    window.addEventListener("hashchange", () => {
      setDashboard(window.location.hash.slice(1), false);
    });

    async function refreshDashboardWhenChanged() {
      try {
        const response = await fetch("/api/health", { cache: "no-store" });
        if (!response.ok) return;
        const health = await response.json();
        const metadata = health.dashboards || {};

        for (const key of Object.keys(dashboards)) {
          const nextVersion = metadata[key] && metadata[key].updated_at;
          if (!nextVersion) continue;
          const previousVersion = dashboardVersions[key];
          dashboardVersions[key] = nextVersion;
          if (previousVersion && previousVersion !== nextVersion && activeDashboard === key) {
            const url = `${dashboards[key].src}?v=${encodeURIComponent(nextVersion)}`;
            frame.src = url;
            openDirect.href = url;
          }
        }
      } catch (error) {
        console.warn("Dashboard update check failed", error);
      }
    }

    setDashboard(window.location.hash.slice(1), false);
    refreshDashboardWhenChanged();
    window.setInterval(refreshDashboardWhenChanged, 60000);
  </script>
</body>
</html>
